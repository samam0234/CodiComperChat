# 나눠 올리는 구성의 백엔드: Oracle Cloud Always Free ARM VM 한 대 (2026-11-06).
#   웹·운영 콘솔 → Vercel (apps/web, console의 vercel.json)
#   이 파일   → caddy(HTTPS) + api(Nest) + postgres + migrate
#   AI        → GPU가 있는 기계(deploy/ai-node)를 Tailscale 사설망으로 붙인다. 없으면 --profile cpu-ai로 이 VM에서 CPU로 돈다(느림)
#
#   cp deploy/oracle/.env.example deploy/oracle/.env   # 값 채우기
#   docker compose --env-file deploy/oracle/.env -f deploy/oracle/docker-compose.yml up -d --build
#   # GPU 기계가 없을 때만: ... --profile cpu-ai up -d --build
#
# 바깥에는 caddy의 80·443만 열린다. 한눈에 보는 안내: docs/web_management/deploy-guide.html
name: codicomperchat-oracle

x-always: &always
  restart: always
  logging:
    driver: json-file
    options: { max-size: 20m, max-file: '5' }

services:
  caddy:
    <<: *always
    image: caddy:2.10-alpine
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      WEB_PROXY_TOKEN: ${WEB_PROXY_TOKEN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  api:
    <<: *always
    build:
      context: ../..
      dockerfile: deploy/node.Dockerfile
      target: api
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      REQUIRE_HTTPS: '1'
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      # GPU 기계의 Tailscale 주소(예: http://100.101.102.103:8000). cpu-ai 프로필이면 http://ai:8000
      AI_BASE_URL: ${AI_BASE_URL:?}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?}
      # 타임아웃 사슬: Vercel 함수 300초 > AI_TIMEOUT_MS(기본 280초) > Ollama 토큰 공백 제한. 느린 서버면 대기열도 길게
      AI_CONCURRENCY: ${AI_CONCURRENCY:-1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-280000}
      AI_BACKGROUND_TIMEOUT_MS: ${AI_BACKGROUND_TIMEOUT_MS:-900000}
      AI_QUEUE_WAIT_MS: ${AI_QUEUE_WAIT_MS:-120000}
      PREMIUM_PROVIDERS: ${PREMIUM_PROVIDERS:-}
      PREMIUM_MONTHLY_CREDITS: ${PREMIUM_MONTHLY_CREDITS:-0}
      ADULT_MODE: ${ADULT_MODE:-off}
      # Vercel에 올린 웹 주소 (메일 속 링크가 이리로 간다)
      WEB_BASE_URL: ${WEB_BASE_URL:?}
      MAIL_SMTP_URL: ${MAIL_SMTP_URL:?}
      MAIL_FROM: ${MAIL_FROM:?}
      PRO_CLICK: ${PRO_CLICK:-on}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      PERSONA_DATA_DIR: /app/apps/api/data/personas
    volumes:
      - personas:/app/apps/api/data/personas
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Tailscale은 호스트에 설치한다. 컨테이너는 호스트의 경로로 100.x 주소에 닿는다
    networks: [edge, internal]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/node.Dockerfile
      target: api
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['sh', '-c', 'npx prisma migrate deploy && npx prisma db seed']
    networks: [internal]

  postgres:
    <<: *always
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ---- GPU 기계가 없을 때만 (--profile cpu-ai). 무료 VM(2 OCPU·12GB)에서 CPU로 돈다.
  # gemma4:e4b는 쓸 만하지만 gemma4:12b는 답 하나에 몇 분 걸린다(추정). 그림 엔진은 빠진다
  ai:
    <<: *always
    profiles: [cpu-ai]
    build:
      context: ../..
      dockerfile: deploy/ai.Dockerfile
      args:
        WITH_IMAGE: '0'
    depends_on: [ollama]
    environment:
      APP_ENV: production
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      # 토큰 사이 공백 제한(초). CPU에서는 첫 토큰 전 프롬프트 읽기가 길다. 0이면 제한 없음
      OLLAMA_READ_TIMEOUT_SECONDS: ${OLLAMA_READ_TIMEOUT_SECONDS:-900}
      OLLAMA_WARMUP: '1'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [internal]

  ollama:
    <<: *always
    profiles: [cpu-ai]
    image: ollama/ollama:0.40.13
    environment:
      # 모델을 메모리에서 내리지 않는다(-1). CPU에서 다시 읽으면 첫 답이 크게 늦어진다
      OLLAMA_KEEP_ALIVE: '-1'
      # 한 번에 하나만: 2코어에서 동시에 돌리면 둘 다 느려져 시간 제한에 걸린다
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  personas:
  ollama_models:

networks:
  edge:
  internal:
