# Oracle 백엔드 구성(docker-compose.yml)에 AI(FastAPI + CPU Ollama)를 더하는 덧붙임 파일.
# 둘 다 내부망에만 있고 바깥 포트를 열지 않는다. api는 기본값 AI_BASE_URL=http://ai:8000으로 이미 이 이름을 부른다.
#
#   docker compose --env-file deploy/oracle/.env -f deploy/oracle/docker-compose.yml -f deploy/oracle/docker-compose.ai.yml up -d --build
#   docker compose ... exec ollama ollama pull gemma4:e4b      # 처음 한 번 (수 GB)
#
# 권장: LLM_BACKEND=openai + NVIDIA NIM 무료 키(GPU급 속도), CPU Ollama는 예비. 그림(코디포토넷·웹툰·AI 초상)은 잠긴다. 절차: docs/web_management/ai-server-guide.html
services:
  ai:
    restart: always
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }
    build:
      context: ../..
      dockerfile: deploy/oracle/ai-cpu.Dockerfile
    depends_on: [ollama]
    environment:
      APP_ENV: production
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      # 무료 호스팅 API(GPU에서 도는 Gemma 4 31B)로 대화한다. 비우면 위 Ollama(CPU)만 쓴다
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_API_BASE: ${LLM_API_BASE:-https://integrate.api.nvidia.com/v1}
      LLM_API_MODEL: ${LLM_API_MODEL:-google/gemma-4-31b-it}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # API가 막히면(한도·서버 오류·시간 초과) CPU Ollama가 대신 답한다
      LLM_FALLBACK_OLLAMA: ${LLM_FALLBACK_OLLAMA:-1}
      # API 응답을 기다리는 최대 시간(초). 넘기면 예비로 넘어간다. API(130초 제한) 안에 예비가 답할 시간을 남긴다
      LLM_API_TIMEOUT_SECONDS: ${LLM_API_TIMEOUT_SECONDS:-45}
      # CPU는 느리니 토큰 사이 공백 제한을 넉넉히
      OLLAMA_READ_TIMEOUT_SECONDS: ${OLLAMA_READ_TIMEOUT_SECONDS:-600}
      # 기동 때 예비 모델을 미리 올려 첫 폴백이 느리지 않게
      OLLAMA_WARMUP: ${OLLAMA_WARMUP:-1}
      # 프리미엄(유료) 공급자 키. 비워 두면 프리미엄 모델은 "준비 중"이다
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    healthcheck:
      # 컨테이너 안 루프백은 토큰 없이 /health를 볼 수 있다
      test: ['CMD', 'python', '-c', "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]

  ollama:
    restart: always
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }
    # GPU 구성(deploy/docker-compose.prod.yml)과 같은 버전. arm64 이미지가 함께 나온다
    image: ollama/ollama:0.40.13
    environment:
      # CPU에서는 모델을 다시 읽는 데 수십 초가 걸려 내리지 않고 둔다
      OLLAMA_KEEP_ALIVE: '-1'
      # 코어가 적어 한 번에 하나만 처리한다 (api의 AI_CONCURRENCY=1과 맞춘다)
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]

volumes:
  ollama_models:
