<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">포트폴리오 프레임워크와 콘텐츠 흐름</title><desc id="desc">정적 자료는 바로 읽고, 프로젝트 질문은 근거 문서를 찾아 답합니다.</desc><rect width="1600" height="1000" fill="#101c2b"/>
<text x="72" y="73" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#e8a06c">CODICOMPERCHAT / ENGINEERING NOTES</text>
<text x="72" y="158" font-family="Malgun Gothic, sans-serif" font-size="51" font-weight="700" fill="#f5f1e9">포트폴리오 프레임워크와 콘텐츠 흐름</text>
<text x="72" y="216" font-family="Malgun Gothic, sans-serif" font-size="26" font-weight="400" fill="#b8c5d5">정적 자료는 바로 읽고, 프로젝트 질문은 근거 문서를 찾아 답합니다.</text>
<text x="72" y="331" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#e8a06c">01  읽기</text>
<rect x="270" y="285" width="1258" height="119" rx="16" fill="#1b2b3f" stroke="#3c5068" stroke-width="2"/>
<text x="300" y="333" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#f5f1e9">Astro</text>
<text x="300" y="375" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#b8c5d5">정적 페이지 · ERD 탐색 · 스프레드시트 · 문서 다운로드</text>
<text x="1150" y="329" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#e8a06c">frontend</text>
<text x="72" y="470" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#e8a06c">02  중계</text>
<rect x="270" y="424" width="1258" height="119" rx="16" fill="#1b2b3f" stroke="#3c5068" stroke-width="2"/>
<text x="300" y="472" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#f5f1e9">Ruby on Rails</text>
<text x="300" y="514" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#b8c5d5">콘텐츠·검색 API · 요청 검사 · Flask 챗봇 중계</text>
<text x="1150" y="468" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#e8a06c">server/backend</text>
<text x="72" y="609" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#e8a06c">03  근거</text>
<rect x="270" y="563" width="1258" height="119" rx="16" fill="#1b2b3f" stroke="#3c5068" stroke-width="2"/>
<text x="300" y="611" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#f5f1e9">Flask / LangChain / LangGraph</text>
<text x="300" y="653" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#b8c5d5">분류 → BM25 검색 → 근거 선별 → 출처를 붙여 답변</text>
<text x="1150" y="607" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#e8a06c">server/ai_services</text>
<text x="72" y="748" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#e8a06c">04  정본</text>
<rect x="270" y="702" width="1258" height="119" rx="16" fill="#1b2b3f" stroke="#3c5068" stroke-width="2"/>
<text x="300" y="750" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#f5f1e9">portfolio.json / 문서 생성기</text>
<text x="300" y="792" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#b8c5d5">사이트 · API · RAG 자료 · Word · PDF · PowerPoint</text>
<text x="1150" y="746" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#e8a06c">shared/content</text>
<text x="72" y="925" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#b8c5d5">운영 기록: Astro는 Vercel, Rails·Flask는 Oracle. Ollama는 제품과 공유합니다.</text>
<text x="72" y="968" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#b8c5d5">설명용 구조도 · 저장소 기준 2026-11-11</text>
</svg>