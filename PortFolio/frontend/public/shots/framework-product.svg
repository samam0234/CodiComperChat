<text x="300" y="514" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#b8c5d5">인증 · 권한 · 코레딧 · 맥락 조립 · AI 요청 대기열</text>
<text x="1150" y="468" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#e8a06c">apps/api</text>
