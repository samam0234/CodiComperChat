<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">제품 프레임워크와 신뢰 경계</title><desc id="desc">이용자 화면과 운영 화면은 Nest를 거쳐 상태와 AI를 사용합니다.</desc><rect width="1600" height="1000" fill="#101c2b"/>
<text x="72" y="73" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#e8a06c">CODICOMPERCHAT / ENGINEERING NOTES</text>
